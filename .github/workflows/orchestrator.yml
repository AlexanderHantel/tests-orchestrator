name: Orchestrator CI

on:
  workflow_dispatch: {}
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Trigger downstream workflows and collect results
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          TARGETS: |
            AlexanderHantel/db-test-scripts|db-test-scripts-ci.yml|main
            AlexanderHantel/db-test-java|db-test-java-ci.yml|main
        run: |
          python .github/scripts/trigger_and_collect.py --targets "$TARGETS"
        continue-on-error: true

      - name: Upload aggregated report
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-report
          path: aggregated-report.md

      - name: Show summary in Actions UI
        if: always()
        run: |
          echo "## Aggregated Report" >> $GITHUB_STEP_SUMMARY
          cat aggregated-report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload orchestrator report artifact
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-report
          path: aggregated-report.md
