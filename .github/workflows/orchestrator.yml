name: Orchestrator CI

on:
  workflow_dispatch: {}
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for scripts)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Trigger downstream workflows and collect results
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          TARGETS: |
            AlexanderHantel/db-test-scripts|db-test-scripts-ci.yml|main
            AlexanderHantel/db-test-java|db-test-java-ci.yml|main
        run: |
          set +e
          python .github/scripts/trigger_and_collect.py --targets "$TARGETS"
          echo "exit_code=$?" >> $GITHUB_ENV

      - name: Upload aggregated report
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-report-${{ github.run_id }}
          path: aggregated-report.md
          if-no-files-found: warn

      - name: Show summary in Actions UI
        if: always()
        run: |
          echo "## Aggregated Report" >> $GITHUB_STEP_SUMMARY
          cat aggregated-report.md >> $GITHUB_STEP_SUMMARY

      - name: Fail workflow if downstream failed
        if: always()
        run: |
          if [ "${{ env.exit_code }}" -ne 0 ]; then
            echo "❌ One or more downstream workflows failed — marking workflow as failed"
            exit 1
          else
            echo "✅ All downstream workflows succeeded"
          fi 
